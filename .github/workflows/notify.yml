name: Notify LeetCode-ADA

on:
  push:
    branches:
      - main

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger LeetCode-ADA
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
            https://api.github.com/repos/Ahsan-Dowla/LeetCode-ADA/dispatches \
            -d '{"event_type":"leetcode-sync"}'
